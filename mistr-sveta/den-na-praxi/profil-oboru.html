<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celý profil absolventa · MISTR SVĚTA</title>
<style>@font-face{font-family:A;src:url(type/atkinson-next.ttf)}*{box-sizing:border-box}body{font:17px/1.45 A,Arial,sans-serif;color:#142f31;background:#f5f3ed;margin:0}main{max-width:1000px;margin:auto;padding:18px}header,section{padding:clamp(16px,4vw,35px)}header{background:#aadbd4}h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;margin:.3em 0}h2,h3,p{margin:.55em 0}summary{cursor:pointer;padding:12px 0;font-weight:bold}section{background:white;margin-top:12px}section>details{border-top:1px solid #a5b7ae}section>details>summary{font-size:1.2rem}details details{margin:0 0 8px;padding:0 14px;background:#f0f6f1}li{margin:.45em 0}a{color:#124b4a}nav{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}button{font:inherit;background:white;border:1px solid;padding:6px 12px;cursor:pointer}.more{background:#ffd3e1}small{display:block}details details>div{padding-bottom:12px}</style>
<main><nav><a id="back"></a><button id="lang"></button></nav><header><b>MISTR SVĚTA</b><h1 id="title"></h1><p id="intro"></p></header><section id="areas"></section><section class="more" id="extra"></section></main><script src="katalog.js"></script><script>
const [back,lang,title,intro,areas,extra]=["back","lang","title","intro","areas","extra"].map(id=>document.getElementById(id));
const params=new URLSearchParams(location.search);let sk=params.get('lang')==='sk';const L=(a,b)=>sk?b:a;
const tasks=[
['Přijmu anglicky objednávku a ověřím si změnu přílohy.','Prijmem objednávku po anglicky a overím si zmenu prílohy.'],
['Německy vysvětlím denní nabídku a ověřím, že jsem hostovi rozuměl/a.','Po nemecky vysvetlím dennú ponuku a overím, že som hosťovi rozumel/a.'],
['Podle ověřeného složení a přání hosta navrhnu vhodnou alternativu.','Podľa overeného zloženia a želania hosťa navrhnem vhodnú alternatívu.'],
['Sestavím tříchodové menu, přiřadím nápoje a vysvětlím své volby.','Zostavím trojchodové menu, priradím nápoje a vysvetlím svoje voľby.'],
['Navrhnu nabídku bistra pro konkrétní hosty a spočítám, kolik porcí potřebuji prodat.','Navrhnem ponuku bistra pre konkrétnych hostí a vypočítam, koľko porcií potrebujem predať.'],
['Připravím objednávku dodavateli včetně množství, jednotek a termínu.','Pripravím objednávku dodávateľovi vrátane množstva, jednotiek a termínu.'],
['Při modelové reklamaci zaznamenám požadavek a předám ho odpovědné osobě.','Pri modelovej reklamácii zaznamenám požiadavku a odovzdám ju zodpovednej osobe.'],
['Vyberu do portfolia snímek práce a odstraním údaje hostů z objednávky.','Vyberiem do portfólia fotografiu práce a odstránim údaje hostí z objednávky.']
];
function render(){
const c=CATALOG[sk?'sk':'cs'];document.documentElement.lang=sk?'sk':'cs';lang.textContent=sk?'Česky':'Slovensky';back.href='./';back.textContent=L('← Zpět do mého profilu','← Späť do môjho profilu');title.textContent=L('Co má zvládnout kuchař–číšník?','Čo má zvládnuť kuchár–čašník?');intro.textContent=L('Celý obor zahrnuje 36 dovedností ve 12 oblastech. Rozbalte oblast a vyberte dovednost. Uvidíte tři praktické úkoly, podle čeho se hodnotí a čím práci doložit.','Celý odbor zahŕňa 36 zručností v 12 oblastiach. Rozbaľte oblasť a vyberte zručnosť. Uvidíte tri praktické úlohy, podľa čoho sa hodnotia a čím prácu doložiť.');
areas.innerHTML=Object.entries(c.areas).map(([code,name])=>'<details><summary>'+name+'</summary>'+c.competencies.filter(x=>x.code.split('.')[0]===code).map(x=>'<details><summary>'+x.name+'</summary><div><small>'+x.branch+' · '+x.year+'. '+L('ročník','ročník')+' · '+c.modules.find(m=>m.id===x.module).title+'</small><p>'+x.goal+'</p><ol>'+x.tasks.map((v,i)=>'<li><b>'+v+'</b><br>'+x.levels[i]+'</li>').join('')+'</ol><p><b>'+L('Pedagog sleduje','Pedagóg sleduje')+'</b> · '+x.checks.join(' · ')+'</p><p><b>'+L('Doklad práce','Doklad práce')+'</b> · '+x.evidence+'</p></div></details>').join('')+'</details>').join('');
extra.innerHTML='<h2>'+L('Co ještě doplnit do profilu','Čo ešte doplniť do profilu')+'</h2><p>'+L('Osm dalších výkonů z pracovního zadání. Jejich rozsah a způsob hodnocení musí škola ověřit podle svého ŠVP.','Osem ďalších výkonov z pracovného zadania. Ich rozsah a spôsob hodnotenia musí škola overiť podľa svojho ŠkVP.')+'</p><ul>'+tasks.map(x=>'<li>'+L(...x)+'</li>').join('')+'</ul>';}
document.getElementById('lang').onclick=()=>{sk=!sk;render()};render();</script></html>
